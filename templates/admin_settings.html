{% extends 'base.html' %}
{% block title %}Admin Ayarları{% endblock %}

{% block content %}
<div class="admin-settings-page">
  <h2>Admin Ayarları</h2>

  <div class="settings-card">
    <h3>Profil Bilgileri</h3>
    <form method="post">
      {% csrf_token %}
      <div class="settings-field">
        <label>Ad Soyad</label>
        <input type="text" name="first_name" value="{{ request.user.first_name }}" placeholder="Ad Soyad" />
      </div>
      <div class="settings-field">
        <label>E-posta</label>
        <input type="email" value="{{ request.user.email }}" disabled />
      </div>
      <button type="submit" class="paws-btn-primary" style="display:inline-flex;margin-top:8px;">Kaydet</button>
    </form>
  </div>

  <div class="settings-card">
    <h3>Sistem Özeti</h3>
    <div class="settings-stats">
      <div class="stat-box">
        <span class="material-symbols-outlined">campaign</span>
        <strong id="totalReports">–</strong>
        <span>Toplam İlan</span>
      </div>
      <div class="stat-box">
        <span class="material-symbols-outlined">group</span>
        <strong id="totalUsers">–</strong>
        <span>Kullanıcı</span>
      </div>
    </div>
  </div>
</div>

<style>
.admin-settings-page { max-width:700px; margin:40px auto; padding:0 16px; }
.admin-settings-page h2 { font-size:24px; font-weight:800; margin-bottom:24px; }

.settings-card {
  background:var(--surface-container-lowest);
  border-radius:20px; padding:28px;
  box-shadow:0 8px 24px var(--shadow-primary);
  margin-bottom:24px;
}
.settings-card h3 { font-size:16px; font-weight:700; margin:0 0 20px; }

.settings-field { margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
.settings-field label { font-size:12px; font-weight:600; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.05em; }
.settings-field input {
  padding:10px 14px;
  background:var(--surface-container);
  border:none; border-radius:12px;
  font-family:'Be Vietnam Pro',sans-serif;
  font-size:14px; color:var(--on-surface);
  outline:none; transition:background .2s;
}
.settings-field input:focus { background:var(--surface-container-lowest); box-shadow:0 0 0 2px rgba(148,74,0,0.2); }
.settings-field input:disabled { opacity:.5; cursor:not-allowed; }

.settings-stats { display:flex; gap:16px; flex-wrap:wrap; }
.stat-box {
  flex:1; min-width:140px;
  background:var(--surface-container);
  border-radius:14px; padding:20px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  text-align:center;
}
.stat-box .material-symbols-outlined { font-size:32px; color:var(--primary); }
.stat-box strong { font-size:28px; font-weight:800; color:var(--on-surface); }
.stat-box span   { font-size:12px; color:var(--on-surface-variant); }
</style>
{% endblock %}
