<!DOCTYPE html>

<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .grainy-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
        }
    </style>

<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-6 selection:bg-tertiary-container selection:text-on-tertiary-container overflow-x-hidden">
<div class="fixed inset-0 grainy-bg"></div>
<div class="relative w-full max-w-md flex flex-col items-center">
<div class="mb-12 text-center relative z-10">
<h1 class="font-headline text-5xl font-black text-primary tracking-tighter mb-2 scale-105 transform -rotate-1">
                Campus Paws
            </h1>
<span class="font-headline text-lg font-bold text-secondary tracking-widest block transform rotate-1">COLLECTIVE</span>
</div>
<div class="w-full bg-surface-container-low rounded-xl shadow-2xl shadow-primary-container/10 p-8 md:p-12 relative flex flex-col border-none transform transition-all duration-300">
<div class="absolute -top-16 -right-12 w-40 h-40 transform rotate-12 hidden md:block">
<div class="w-full h-full rounded-lg bg-tertiary-container flex items-center justify-center p-2 shadow-xl rotate-3">
<img alt="Adorable orange tabby cat with a curious expression sitting in a sunlit campus garden, oil painting style" class="w-full h-full object-cover rounded-md" data-alt="Adorable orange tabby cat with a curious expression sitting in a sunlit campus garden, warm sunbeams, painterly oil style with visible brushstrokes" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAENxY8bO31MdQffwWhfoR5hAc29iskoELwJeBng9wP39q8MJ8KeeBedmVOnqpjZdDs9wnvlmY7rzUtPlBE_5SkObw6E0WXhXeH7mXKzcFa_C2StLTGuLZLq7NaG7HHcTUcQFTKNgpkf5Be3hYN6UPkInvc3nNbev7bIhrhysx_zs9uUlJL6qj1KhuSncscBBTvAijgHhCOzFvinYYZOcyDDBAG7oSwTpWZqSV0wv8GzZvTj3F3eItnbRQNpJBIfvENv45HnnteCWGu"/>
</div>
<div class="absolute -bottom-2 -left-2 bg-secondary text-on-secondary text-[10px] font-headline font-bold px-3 py-1 rounded-full shadow-lg -rotate-6">
                    Mascot: Ginger!
                </div>
</div>
<div class="space-y-8">
<header>
<h2 class="text-3xl font-headline font-extrabold text-on-surface leading-tight">Welcome Back!</h2>
<p class="text-on-surface-variant text-sm mt-2">Log in to check on your campus furry friends.</p>
</header>
<form class="space-y-6">
<div class="space-y-4">
<div class="relative group">
<label class="block text-xs font-headline font-bold text-primary mb-1.5 ml-1">UNIVERSITY EMAIL</label>
<input class="w-full px-6 py-4 bg-surface-container-lowest border-none rounded-full text-on-surface placeholder:text-outline-variant focus:ring-4 focus:ring-secondary/20 transition-all" placeholder="student@university.edu" type="email"/>
</div>
<div class="relative group">
<label class="block text-xs font-headline font-bold text-primary mb-1.5 ml-1">PASSWORD</label>
<input class="w-full px-6 py-4 bg-surface-container-lowest border-none rounded-full text-on-surface placeholder:text-outline-variant focus:ring-4 focus:ring-secondary/20 transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center space-x-3 cursor-pointer group">
<div class="relative">
<input class="sr-only peer" type="checkbox"/>
<div class="w-10 h-6 bg-surface-container-highest rounded-full peer peer-checked:bg-secondary transition-colors"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
</div>
<span class="text-xs font-headline font-bold text-on-surface-variant group-hover:text-secondary transition-colors">Admin login</span>
</label>
<a class="text-xs font-headline font-bold text-secondary hover:underline underline-offset-4" href="#">Forgot password?</a>
</div>
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline font-black text-lg rounded-full shadow-lg shadow-primary-container/40 hover:bg-primary-fixed-dim hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-xl" data-icon="pets">pets</span>
</button>
</form>
<div class="text-center">
<p class="text-on-surface-variant text-sm font-medium">
                        Don't have an account? 
                        <a class="text-secondary font-headline font-bold ml-1 hover:underline underline-offset-4 decoration-2" href="#">Create an account</a>
</p>
</div>
</div>
<div class="absolute -bottom-8 -left-10 w-24 h-24 hidden md:flex items-center justify-center bg-tertiary rounded-xl rotate-[-15deg] shadow-lg">
<span class="material-symbols-outlined text-tertiary-container text-5xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<div class="mt-12 flex items-center gap-6 text-on-surface-variant/40">
<span class="material-symbols-outlined text-4xl" data-icon="house">house</span>
<span class="material-symbols-outlined text-4xl" data-icon="location_on">location_on</span>
<span class="material-symbols-outlined text-4xl" data-icon="volunteer_activism">volunteer_activism</span>
</div>
<div class="mt-8 text-center px-4">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant/60 font-headline font-bold">
                Supported by the Student Union &amp; Campus Wildlife Foundation
            </p>
</div>
</div>
</body></html>
